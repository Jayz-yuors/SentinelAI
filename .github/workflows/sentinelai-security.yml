name: SentinelAI Security Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  sentinelai-security:

    name: SentinelAI Security Analysis

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ai/requirements.txt

      - name: Install Semgrep
        run: |
          pip install semgrep

      - name: Install Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: trivy-results.json
          exit-code: 0

      - name: Run SentinelAI gate
        env:
          SENTINELAI_EXTERNAL_TOOLS_ENABLED: "true"
          SENTINELAI_SECURITY_GATE_MAX_SCORE: "50"
          SENTINELAI_SECURITY_GATE_BLOCK_CRITICAL: "true"
          SENTINELAI_SECURITY_GATE_BLOCK_HIGH: "false"
        run: |
          python -m ai.cli.main gate .